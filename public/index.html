                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">{siteData.portfolio.map(project => <AnimatedSection key={project.title} className="content-card rounded-lg overflow-hidden shadow-lg group transition-all duration-300 hover:shadow-amber-500/20 hover:-translate-y-1 border"><img src={project.image} alt={`${project.title} in ${project.location}`} className="w-full h-56 object-cover" /><div className="p-5"><h3 className="text-lg font-semibold text-white">{project.title}</h3><p className="text-amber-400 font-medium text-sm">{project.location}</p></div></AnimatedSection>)}</div>
                <div className="mt-20"><CtaBanner /></div>
            </PageShell>
        );
        const AboutPage = () => (
            <PageShell title="ABOUT PAUL'S ROOFING" subtitle="A LEGACY OF QUALITY, BUILT ON 30 YEARS OF TRUST AND EXPERIENCE.">
                <div className="space-y-16">
                    <AnimatedSection className="content-card p-8 md:p-12 rounded-lg shadow-lg border"><div className="flex flex-wrap md:flex-nowrap gap-10 items-center"><div className="w-full md:w-1/3"><img src={siteData.about.ownerImageUrl} alt="Paul, owner of Paul's Roofing" className="rounded-lg shadow-md w-full" /></div><div className="w-full md:w-2/3"><h2 className="text-2xl font-bold text-amber-400 mb-4">OUR STORY</h2><div className="prose prose-invert max-w-none text-gray-300"><p>For over 30 years, Paul's Roofing has been a trusted name in the roofing industry across Southern New Brunswick. Founded on principles of integrity, unmatched craftsmanship, and genuine customer care, we have built our reputation one roof at a time.</p><p>Our passion is providing peace of mind and protecting families' most valuable assets. Every project is approached with the precision and attention to detail that only decades of hands-on experience can provide.</p></div></div></div></AnimatedSection>
                    <AnimatedSection><h2 className="text-3xl font-bold text-white text-center mb-12">WHY WE'RE DIFFERENT</h2><div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 text-center">{siteData.whyUs.map(item => <div key={item.title} className="content-card p-6 rounded-lg border"><div className="text-amber-400 w-12 h-12 flex items-center justify-center mx-auto mb-4"><Icon name={item.icon} /></div><h3 className="font-semibold text-lg text-white mb-2">{item.title}</h3><p className="text-sm text-gray-400">{item.desc}</p></div>)}</div></AnimatedSection>
                    <AnimatedSection><h2 className="text-3xl font-bold text-white text-center mb-8">OUR PROCESS: SIMPLE & TRANSPARENT</h2><div className="grid grid-cols-1 md:grid-cols-4 gap-8 text-center">{siteData.processSteps.map(item => <div key={item.step} className="content-card p-6 rounded-lg shadow-lg border"><div className="bg-amber-500 text-gray-900 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl">{item.step}</div><h3 className="font-semibold text-lg text-white mb-2">{item.title}</h3><p className="text-sm text-gray-400">{item.desc}</p></div>)}</div></AnimatedSection>
                </div>
                <div className="mt-20"><CtaBanner /></div>
            </PageShell>
        );
        const ContactPage = () => {
            const [step, setStep] = React.useState(1);
            const [formData, setFormData] = React.useState({ projectType: '', roofType: '', roofColor: '', description: '', firstName: '', lastName: '', email: '', phone: '', photo: null, photoPreview: null });
            const [isLoading, setIsLoading] = React.useState(false);
            const [visualizedImage, setVisualizedImage] = React.useState(null);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({ ...prev, photo: file, photoPreview: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleVisualize = async () => {
                if (!formData.photo || !formData.roofType || !formData.roofColor) return;
                setIsLoading(true);
                setVisualizedImage(null);
                try {
                    const result = await mockApi.visualizeRoof(formData.photo, formData.roofType, formData.roofColor);
                    setVisualizedImage(result.imageDataUri);
                } catch (error) {
                    console.error("Visualization failed:", error);
                    alert("Sorry, the AI visualizer failed. Please try another image.");
                } finally {
                    setIsLoading(false);
                }
            };
            
            const handleSubmit = (e) => { 
                e.preventDefault(); 
                setStep(4); 
            };
            const nextStep = () => setStep(s => s + 1);
            const prevStep = () => setStep(s => s - 1);

            const projectTypes = [{id: 'new-roof', label: 'New Roof'}, {id: 'replacement', label: 'Replacement'}, {id: 'repair', label: 'Repair/Leak'}, {id: 'inspection', label: 'Inspection'}];
            const roofTypes = [{id: 'metal', label: 'Metal'}, {id: 'shingles', label: 'Shingles'}, {id: 'unsure', label: 'Unsure'}];
            
            if (step === 4) {
                return (
                    <PageShell title="REQUEST RECEIVED">
                        <div className="content-card p-8 rounded-lg shadow-lg max-w-4xl mx-auto border text-center">
                            <Icon name="CheckIcon" className="mx-auto h-16 w-16 text-green-400" />
                            <h2 className="mt-4 text-2xl font-bold text-white">THANK YOU, {formData.firstName.toUpperCase()}!</h2>
                            <p className="mt-2 text-gray-300">Your project request has been submitted. We will review the details and contact you at <strong>{formData.email}</strong> or <strong>{formData.phone}</strong> within one business day.</p>
                            <div className="mt-6">
                                <Link href="/" className="bg-amber-500 text-gray-900 font-bold px-6 py-2 rounded-md hover:bg-amber-400">RETURN HOME</Link>
                            </div>
                        </div>
                    </PageShell>
                )
            }

            return (<PageShell title="GET A FREE QUOTE" subtitle="OUR INTERACTIVE PROJECT CONFIGURATOR MAKES GETTING AN ESTIMATE QUICK AND EASY.">
                <div className="content-card p-8 rounded-lg shadow-lg max-w-4xl mx-auto border">
                    <div className="flex justify-between items-center mb-4">
                        <img src={siteData.branding.lunaiLogoUrl} alt="lunAi Logo" className="h-8" />
                        <p className="text-sm text-gray-500">Interactive Quote by lunAi</p>
                    </div>
                    <div className="mb-8"><div className="w-full bg-gray-700 rounded-full h-2.5"><div className="bg-amber-500 h-2.5 rounded-full transition-all duration-500" style={{width: `${(step/3)*100}%`}}></div></div></div>
                    <form data-netlify="true" name="quote" onSubmit={handleSubmit} className="space-y-8">
                        <input type="hidden" name="form-name" value="quote" />
                        {step === 1 && <AnimatedSection> <h3 className="text-lg font-semibold text-white mb-4 text-center">STEP 1: WHAT TYPE OF PROJECT IS THIS?</h3><div className="grid grid-cols-2 md:grid-cols-4 gap-4">{projectTypes.map(type => <button key={type.id} type="button" onClick={() => { setFormData(p => ({...p, projectType: type.label})); nextStep(); }} className={`p-4 rounded-lg border-2 text-center transition-all duration-200 ${formData.projectType === type.label ? 'bg-amber-500 border-amber-400 text-gray-900' : 'bg-gray-700 border-gray-600 hover:border-amber-500'}`}><span className="font-bold block">{type.label}</span></button>)}</div></AnimatedSection>}
                        {step === 2 && <AnimatedSection>
                            <h3 className="text-lg font-semibold text-white mb-4 text-center">STEP 2: WHAT TYPE OF ROOF?</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">{roofTypes.map(type => <button key={type.id} type="button" onClick={() => setFormData(p => ({...p, roofType: type.label}))} className={`p-4 rounded-lg border-2 text-center transition-all duration-200 ${formData.roofType === type.label ? 'bg-amber-500 border-amber-400 text-gray-900' : 'bg-gray-700 border-gray-600 hover:border-amber-500'}`}><span className="font-bold block">{type.label}</span></button>)}</div>
                            
                            {formData.roofType && formData.roofType !== 'unsure' &&
                                <div className="mt-6">
                                    <h4 className="text-md font-semibold text-white mb-2 text-center">CHOOSE A COLOR</h4>
                                    <div className="flex justify-center gap-2 mt-2 flex-wrap">
                                        {(formData.roofType === 'Metal' ? siteData.services[0].colors : siteData.services[1].colors).map(color => (
                                            <button type="button" key={color.name} onClick={() => setFormData(p => ({...p, roofColor: color.name}))} className="w-8 h-8 rounded-full border-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition-transform hover:scale-110" style={{ backgroundColor: color.color, borderColor: formData.roofColor === color.name ? '#f59e0b' : '#374151' }} aria-label={color.name} title={color.name} />
                                        ))}
                                    </div>
                                </div>
                            }
                            
                            <h4 className="text-md font-semibold text-white mb-2 text-center mt-6">UPLOAD A PHOTO & TRY OUR AI VISUALIZER</h4>
                            <div className="mt-2 flex justify-center rounded-lg border border-dashed border-gray-600 px-6 py-10">
                                <div className="text-center">
                                    {formData.photoPreview ? (
                                        <img src={visualizedImage || formData.photoPreview} alt="House Preview" className="max-h-48 mx-auto rounded-md" />
                                    ) : (
                                        <Icon name="UploadCloudIcon" className="mx-auto h-12 w-12 text-gray-500" />
                                    )}
                                    <div className="mt-4 flex text-sm leading-6 text-gray-400 justify-center">
                                        <label htmlFor="file-upload" className="relative cursor-pointer rounded-md font-semibold text-amber-400 focus-within:outline-none focus-within:ring-2 focus-within:ring-amber-500 focus-within:ring-offset-2 focus-within:ring-offset-gray-900 hover:text-amber-300">
                                            <span>{formData.photo ? 'Change file' : 'Upload a file'}</span>
                                            <input id="file-upload" name="photo" type="file" className="sr-only" onChange={handleFileChange} accept="image/*" />
                                        </label>
                                        {!formData.photoPreview && <p className="pl-1">or drag and drop</p>}
                                    </div>
                                    <p className="text-xs leading-5 text-gray-500">PNG, JPG, GIF up to 10MB</p>
                                    {formData.photo && <p className="text-sm mt-2 text-green-400">File selected: {formData.photo.name}</p>}
                                    
                                    {formData.photo && (
                                        isLoading ? (
                                            <div className="mt-4 flex justify-center items-center gap-2 text-amber-400"><div className="spinner !w-5 !h-5 !border-2"></div><span>Visualizing...</span></div>
                                        ) : (
                                            <button type="button" onClick={handleVisualize} disabled={!formData.photo || !formData.roofType || !formData.roofColor} className="mt-4 inline-flex items-center gap-2 bg-gray-600 text-white font-bold px-4 py-2 rounded-md hover:bg-gray-500 disabled:opacity-50 disabled:cursor-not-allowed">
                                                <Icon name="WandIcon" />
                                                Visualize My New Roof
                                            </button>
                                        )
                                    )}
                                </div>
                            </div>
                        </AnimatedSection>}
                        {step === 3 && <AnimatedSection> <h3 className="text-lg font-semibold text-white mb-4 text-center">STEP 3: YOUR CONTACT INFORMATION</h3><div className="grid grid-cols-1 md:grid-cols-2 gap-6"><input name="firstName" value={formData.firstName} onChange={handleChange} placeholder="First Name *" required className="w-full bg-gray-900 text-gray-300 p-3 rounded-md border border-gray-600 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none" /><input name="lastName" value={formData.lastName} onChange={handleChange} placeholder="Last Name *" required className="w-full bg-gray-900 text-gray-300 p-3 rounded-md border border-gray-600 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none" /><input type="email" name="email" value={formData.email} onChange={handleChange} placeholder="Email *" required className="w-full bg-gray-900 text-gray-300 p-3 rounded-md border border-gray-600 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none" /><input type="tel" name="phone" value={formData.phone} onChange={handleChange} placeholder="Phone *" required className="w-full bg-gray-900 text-gray-300 p-3 rounded-md border border-gray-600 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none" /></div></AnimatedSection>}
                        <div className="flex justify-between items-center pt-4"> {step > 1 ? <button type="button" onClick={prevStep} className="bg-gray-600 text-white font-bold px-6 py-2 rounded-md hover:bg-gray-500">BACK</button> : <span></span>} {step < 3 ? <button type="button" onClick={nextStep} className="bg-amber-500 text-gray-900 font-bold px-6 py-2 rounded-md hover:bg-amber-400">NEXT</button> : <button type="submit" className="bg-green-600 text-white font-bold px-6 py-2 rounded-md hover:bg-green-700">SUBMIT REQUEST</button>}</div>
                    </form>
                </div>
            </PageShell>);
        };
        const SimplePage = ({ title, children }) => (<PageShell title={title}><div className="content-card p-8 md:p-12 rounded-lg shadow-lg max-w-4xl mx-auto border"><div className="prose prose-invert max-w-none text-gray-300">{children}</div></div></PageShell>);
        const BlogPage = () => (
            <PageShell title="The Roofing Chronicles" subtitle="Paul's pearls of wisdom, dad jokes, and expert advice on everything roofing in Southern New Brunswick.">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    {siteData.blogPosts.map(post => (
                        <AnimatedSection key={post.slug} className="content-card rounded-lg overflow-hidden shadow-lg group transition-all duration-300 hover:shadow-amber-500/20 hover:-translate-y-1 border">
                           <Link href={`/blog/${post.slug}`}><img src={post.image} alt={post.title} className="w-full h-56 object-cover" /></Link>
                            <div className="p-6">
                                <p className="text-sm text-gray-400 mb-2">{post.publishedDate} &bull; {post.category}</p>
                                <h3 className="text-lg font-semibold text-white mb-2 group-hover:text-amber-400 transition-colors"><Link href={`/blog/${post.slug}`}>{post.title}</Link></h3>
                                <p className="text-sm text-gray-400 mb-4">{post.introduction}</p>
                                <Link href={`/blog/${post.slug}`} className="font-semibold text-amber-400 hover:text-amber-300 text-sm">READ MORE &raquo;</Link>
                            </div>
                        </AnimatedSection>
                    ))}
                </div>
            </PageShell>
        );
        const BlogPostPage = ({ params }) => {
            const post = siteData.blogPosts.find(p => p.slug === params.slug);
            if (!post) return <NotFoundPage />;
            
            return (
                <PageShell title={post.title} subtitle={`${post.publishedDate} | ${post.category}`}>
                    <div className="content-card p-8 md:p-12 rounded-lg shadow-lg max-w-4xl mx-auto border">
                        <img src={post.image} alt={post.title} className="w-full rounded-md mb-8" />
                        <div className="prose prose-lg prose-invert max-w-none text-gray-300">
                           <p className="lead text-xl italic">{post.introduction}</p>
                            {post.mainContent.map((section, index) => (
                                <div key={index}>
                                    <h3 className="text-2xl font-bold text-amber-400 mt-10 mb-4">{section.heading}</h3>
                                    {section.paragraphs.map((p, i) => (
                                        <p key={i}>{p}</p>
                                    ))}
                                </div>
                            ))}
                            <h3 className="text-2xl font-bold text-amber-400 mt-10 mb-4">In Conclusion...</h3>
                            <p>{post.conclusion}</p>
                        </div>
                    </div>
                </PageShell>
            );
        };
        const PrivacyPolicyPage = () => (<SimplePage title="PRIVACY POLICY"><p><strong>Effective Date: July 13, 2025</strong></p><p>At Paul's Roofing, we are committed to protecting the privacy of our visitors and clients. This Privacy Policy outlines the types of information we collect, how it is used, and the steps we take to safeguard your personal data.</p><h3>INFORMATION WE COLLECT</h3><p>We collect information to provide better services. This includes personal information you provide through our contact forms (such as name, email address, and phone number) and non-personally identifiable usage data collected automatically (such as browser type and pages visited).</p><h3>HOW WE USE YOUR INFORMATION</h3><p>Your information is used solely to respond to your direct inquiries, provide quotes, schedule appointments, and improve our website. We do not use your information for marketing mailing lists without your explicit consent.</p><h3>SHARING YOUR INFORMATION</h3><p>Paul's Roofing does not sell, trade, or otherwise transfer your personally identifiable information to outside parties. This does not include trusted third parties who assist us in operating our website or conducting our business, so long as those parties agree to keep this information confidential.</p></SimplePage>);
        const NotFoundPage = () => (<PageShell title="404 - PAGE NOT FOUND"><div className="text-center"><p className="mb-8 text-lg">Oops! The page you're looking for doesn't seem to exist.</p><Link href="/" className="inline-block bg-amber-500 text-gray-900 font-bold px-6 py-3 rounded-md hover:bg-amber-400 transition-colors">RETURN TO HOMEPAGE</Link></div></PageShell>);
        
        // This is a simplified version of the Boss Quarters for this single-file app
        const BossQuartersPage = () => {
            const [password, setPassword] = React.useState('');
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            const [activeTool, setActiveTool] = React.useState('overview');
            const BOSS_PASSWORD = "paul2025";
            
            const handleLogin = (e) => {
                e.preventDefault();
                if (password === BOSS_PASSWORD) {
                    setIsAuthenticated(true);
                } else {
                    alert('Incorrect Password');
                }
            };

            const tools = [
                { id: 'overview', name: 'Overview' },
                { id: 'quote-gen', name: 'AI Quote Generator' },
                { id: 'invoice-gen', name: 'AI Invoice Generator' },
                { id: 'promoter', name: 'AI Project Promoter' },
                { id: 'blog-writer', name: 'AI Blog Writer' },
                { id: 'story-teller', name: 'AI Homestead Storyteller' },
                { id: 'daily-log', name: 'Daily Log' }
            ];

            const ToolContent = () => {
                // In a real app, each tool would be its own component with state and logic
                return (
                    <div className="content-card p-6 border rounded-lg">
                        <h3 className="text-2xl font-bold text-amber-400 mb-4">{tools.find(t => t.id === activeTool).name}</h3>
                        <p>This is a placeholder for the {tools.find(t => t.id === activeTool).name}.</p>
                        <p className="mt-4 text-sm text-gray-500">In a full application, this area would contain the specific forms, inputs, and outputs for the selected AI tool, connected to a Genkit backend.</p>
                    </div>
                );
            }
            
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-900 pt-20">
                        <AnimatedSection className="w-full max-w-md">
                            <form onSubmit={handleLogin} className="content-card shadow-lg rounded-lg p-8 space-y-6 border">
                                <div className="text-center">
                                    <Icon name="LockIcon" className="mx-auto h-12 w-12 text-amber-400" />
                                    <h2 className="mt-6 text-center text-3xl font-bold tracking-tight text-white">BOSS QUARTERS</h2>
                                    <p className="mt-2 text-center text-sm text-gray-400">AUTHORIZED ACCESS ONLY</p>
                                </div>
                                <div>
                                    <label htmlFor="password"className="block text-sm font-medium text-gray-300">PASSWORD</label>
                                    <div className="mt-1">
                                        <input id="password" name="password" type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-gray-900 text-gray-300 p-3 rounded-md border border-gray-600 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <button type="submit" className="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-gray-900 bg-amber-500 hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-amber-500">
                                        SECURE LOGIN
                                    </button>
                                </div>
                            </form>
                        </AnimatedSection>
                    </div>
                );
            }

            return (
                 <PageShell title="Boss Quarters" subtitle="Your AI-Powered Command Center">
                    <div className="flex flex-col md:flex-row gap-8">
                        <aside className="w-full md:w-1/4">
                            <div className="content-card p-4 rounded-lg border">
                                <h3 className="font-bold text-white mb-4">AI Tools</h3>
                                <ul className="space-y-2">
                                    {tools.map(tool => (
                                        <li key={tool.id}>
                                            <button onClick={() => setActiveTool(tool.id)} className={`w-full text-left px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTool === tool.id ? 'bg-amber-500 text-gray-900' : 'text-gray-300 hover:bg-gray-700'}`}>
                                                {tool.name}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                                <button onClick={() => setIsAuthenticated(false)} className="mt-6 w-full bg-red-600 text-white font-bold px-3 py-2 rounded-md hover:bg-red-700">Logout</button>
                            </div>
                        </aside>
                        <main className="w-full md:w-3/4">
                            <ToolContent />
                        </main>
                    </div>
                 </PageShell>
            );
        };


        // --- MAIN APP COMPONENT ---
        const App = () => {
          return (
            <HashRouter>
              <Header />
              <main className="min-h-screen">
                <Switch>
                  <Route path="/" component={HomePage} />
                  <Route path="/what-we-do" component={ServicesPage} />
                  <Route path="/where-we-do-it" component={PortfolioPage} />
                  <Route path="/ask-your-neighbour" component={AboutPage} />
                  <Route path="/get-quote" component={ContactPage} />
                  <Route path="/blog" component={BlogPage} />
                  <Route path="/blog/:slug" component={BlogPostPage} />
                  <Route path="/privacy" component={PrivacyPolicyPage} />
                  <Route path="/hq" component={BossQuartersPage} />
                  <Route component={NotFoundPage} />
                </Switch>
              </main>
              <Footer />
              <FloatingCta />
            </HashRouter>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
